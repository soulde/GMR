robot: unitree_go2
model_type: quadruped
mjcf_path: assets/quadrupeds/unitree_go2/go2.xml
root_body: base
legs:
  FL:
    joints: [FL_hip_joint, FL_thigh_joint, FL_calf_joint]
    foot_site: FL_foot_site
  FR:
    joints: [FR_hip_joint, FR_thigh_joint, FR_calf_joint]
    foot_site: FR_foot_site
  RL:
    joints: [RL_hip_joint, RL_thigh_joint, RL_calf_joint]
    foot_site: RL_foot_site
  RR:
    joints: [RR_hip_joint, RR_thigh_joint, RR_calf_joint]
    foot_site: RR_foot_site
motion:
  quaternion_order: wxyz
  joint_order:
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
reference_pose:
  FL_hip_joint: 0.0
  FL_thigh_joint: 0.9
  FL_calf_joint: -1.8
  FR_hip_joint: 0.0
  FR_thigh_joint: 0.9
  FR_calf_joint: -1.8
  RL_hip_joint: 0.0
  RL_thigh_joint: 0.9
  RL_calf_joint: -1.8
  RR_hip_joint: 0.0
  RR_thigh_joint: 0.9
  RR_calf_joint: -1.8
joint_mapping:
  hip: {sign: 1.0, scale: 1.0}
  thigh: {sign: 1.0, scale: 1.0}
  calf: {sign: 1.0, scale: 1.0}
