robot: laikago
model_type: quadruped
mjcf_path: assets/quadrupeds/laikago/laikago.xml
root_body: trunk
legs:
  FL:
    joints: [FL_hip_joint, FL_thigh_joint, FL_calf_joint]
    foot_site: FL_foot_site
  FR:
    joints: [FR_hip_joint, FR_thigh_joint, FR_calf_joint]
    foot_site: FR_foot_site
  RL:
    joints: [RL_hip_joint, RL_thigh_joint, RL_calf_joint]
    foot_site: RL_foot_site
  RR:
    joints: [RR_hip_joint, RR_thigh_joint, RR_calf_joint]
    foot_site: RR_foot_site
motion:
  quaternion_order: wxyz
  root_orientation_mode: relative_first_frame
  joint_order:
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
reference_pose:
  FR_hip_joint: 0.0
  FR_thigh_joint: 0.67
  FR_calf_joint: -1.25
  FL_hip_joint: 0.0
  FL_thigh_joint: 0.67
  FL_calf_joint: -1.25
  RR_hip_joint: 0.0
  RR_thigh_joint: 0.67
  RR_calf_joint: -1.25
  RL_hip_joint: 0.0
  RL_thigh_joint: 0.67
  RL_calf_joint: -1.25
