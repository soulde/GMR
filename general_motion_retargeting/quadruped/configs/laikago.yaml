robot: laikago
model_type: quadruped
mjcf_path: assets/quadrupeds/laikago/laikago.xml
root_body: trunk
# The source foot sites are at the centers of 30 mm spherical toes.
foot_contact_offset: 0.03
legs:
  FL:
    joints: [FL_hip_joint, FL_thigh_joint, FL_calf_joint]
    foot_site: FL_foot_site
  FR:
    joints: [FR_hip_joint, FR_thigh_joint, FR_calf_joint]
    foot_site: FR_foot_site
  RL:
    joints: [RL_hip_joint, RL_thigh_joint, RL_calf_joint]
    foot_site: RL_foot_site
  RR:
    joints: [RR_hip_joint, RR_thigh_joint, RR_calf_joint]
    foot_site: RR_foot_site
motion:
  quaternion_order: xyzw
  # Upstream Laikago URDF points along +Z with its belly toward +Y.
  # Motion Imitation rotates it into a Z-up locomotion frame.
  root_frame_rotation: [0.5, 0.5, 0.5, 0.5]
  joint_order:
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
